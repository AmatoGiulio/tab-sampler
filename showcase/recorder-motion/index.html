<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tab Sampler Motion Study</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08090b;color:#f7f7f4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.035),transparent 36%),#08090b}
body{display:grid;place-items:center}
button{font:inherit}
.stage{width:min(76vw,760px);aspect-ratio:1;display:grid;place-items:center}
.space{position:relative;width:352px;height:336px;transform:scale(1.42);transform-origin:center}
.surface{position:absolute;top:0;right:0;width:198px;height:50px;overflow:hidden;border-radius:25px;isolation:isolate;background:radial-gradient(120% 140% at 22% -28%,rgba(255,255,255,.105) 0%,rgba(255,255,255,.018) 34%,transparent 62%),linear-gradient(180deg,rgba(24,24,27,.92),rgba(12,12,15,.95));box-shadow:0 12px 34px rgba(0,0,0,.31),0 1px 0 rgba(255,255,255,.17) inset,0 0 0 1px rgba(255,255,255,.035) inset,0 -1px 0 rgba(0,0,0,.24) inset;transition:width 390ms cubic-bezier(.16,1,.3,1),height 390ms cubic-bezier(.16,1,.3,1),border-radius 390ms cubic-bezier(.16,1,.3,1),box-shadow 360ms cubic-bezier(.16,1,.3,1);transform-origin:100% 0}
.surface:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(132deg,rgba(255,255,255,.095),rgba(255,255,255,.018) 19%,transparent 44%);mix-blend-mode:screen}
.surface:after{content:"";position:absolute;inset:1px;z-index:9;pointer-events:none;border-radius:inherit;box-shadow:0 0 0 1px rgba(255,255,255,.038) inset,0 0 18px rgba(255,255,255,.014) inset}
.surface.expanded{width:352px;height:336px;border-radius:48px;box-shadow:0 26px 64px rgba(0,0,0,.38),0 8px 22px rgba(0,0,0,.21),0 1px 0 rgba(255,255,255,.18) inset,0 0 0 1px rgba(255,255,255,.035) inset,0 -1px 0 rgba(0,0,0,.28) inset}
.recorder{position:absolute;z-index:2;inset:0;display:grid;grid-template-columns:24px 1fr 42px;align-items:center;gap:10px;padding:0 13px 0 10px;transition:opacity 90ms ease,transform 150ms cubic-bezier(.4,0,.8,.2)}
.surface.expanded .recorder{opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none}
.stop{width:24px;height:24px;position:relative;padding:0;border:0;border-radius:999px;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.18),transparent 42%),linear-gradient(180deg,#ff4b42 0%,#ff3129 54%,#e92721 100%);box-shadow:0 4px 12px rgba(255,48,40,.18),0 1px 0 rgba(255,255,255,.22) inset,0 -1px 0 rgba(110,0,0,.16) inset;cursor:pointer;transition:filter 120ms ease}
.stop:before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:2px;background:rgba(255,255,255,.96)}
.stop:hover{filter:brightness(1.04)} .stop:active{filter:brightness(.96)}
.wavewrap{min-width:0;height:28px;display:grid;align-items:center;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.5) 10%,#000 22%,#000 88%,rgba(0,0,0,.7) 95%,transparent);mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.5) 10%,#000 22%,#000 88%,rgba(0,0,0,.7) 95%,transparent)}
#liveWave{width:100%;height:28px;display:block}
.timer{font:590 10px/1 ui-monospace,"SFMono-Regular","SF Mono","Roboto Mono",monospace;letter-spacing:-.055em;color:rgba(255,255,255,.86);text-align:right;font-variant-numeric:tabular-nums}
.editor{position:absolute;z-index:3;inset:0;width:352px;height:336px;padding:22px 24px 20px;display:grid;grid-template-rows:1fr 88px;gap:10px;opacity:0;pointer-events:none;transform:translateY(6px) scale(.994);transition:opacity 150ms ease 120ms,transform 240ms cubic-bezier(.2,.8,.2,1) 80ms}
.surface.expanded .editor{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.waveShell{position:relative;min-height:194px;display:grid;align-items:center;overflow:hidden}
.fullWave{position:absolute;inset:42px 0;display:flex;align-items:center;gap:4px;-webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 5%,rgba(0,0,0,.72) 13%,#000 22%,#000 78%,rgba(0,0,0,.72) 87%,rgba(0,0,0,.18) 95%,transparent);mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 5%,rgba(0,0,0,.72) 13%,#000 22%,#000 78%,rgba(0,0,0,.72) 87%,rgba(0,0,0,.18) 95%,transparent)}
.fullWave span{width:2px;flex:0 0 2px;border-radius:999px;background:rgba(255,255,255,.72)}
.playhead{position:absolute;z-index:6;top:28px;bottom:28px;left:0;width:2px;border-radius:999px;background:#ff3b30;box-shadow:0 0 4px rgba(255,59,48,.82),0 0 10px rgba(255,59,48,.28)}
.utilities{position:absolute;top:14px;right:16px;z-index:20;display:flex;gap:5px;opacity:.62}
.utility{width:22px;height:22px;display:grid;place-items:center;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.055);color:rgba(255,255,255,.72);cursor:pointer}
.utility svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.controls{display:grid;grid-template-columns:minmax(0,1fr) 52px 72px;align-items:center;gap:9px;padding-left:2px}
.status{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.8);font-size:9px;font-weight:700;letter-spacing:.21em}
.statusDot{width:8px;height:8px;border-radius:50%;background:rgba(245,245,242,.92)}
.sampleTime{margin-top:10px;font:560 20px/1 ui-monospace,"SFMono-Regular","SF Mono","Roboto Mono",monospace;letter-spacing:-.07em;font-variant-numeric:tabular-nums}
.control{border:0;color:#f7f7f4;cursor:pointer;transition:transform 105ms cubic-bezier(.22,.9,.28,1),filter 120ms ease}
.control:active{transform:scale(.965)}
.loop{width:52px;height:72px;border-radius:25px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.055));box-shadow:0 10px 22px rgba(0,0,0,.24),0 1px 0 rgba(255,255,255,.12) inset}
.loop.active{background:linear-gradient(180deg,#3b3b3d,#29292b)}
.play{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 36% 22%,rgba(255,255,255,.16),transparent 34%),linear-gradient(180deg,#ff4940 0%,#ff332b 52%,#ee241e 100%);box-shadow:0 14px 30px rgba(0,0,0,.34),0 6px 18px rgba(255,45,38,.16),0 1px 0 rgba(255,255,255,.24) inset}
.control svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.play svg{width:25px;height:25px;stroke-width:1.9}
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.28);white-space:nowrap;user-select:none}
body.clean .hint{display:none}
@media(max-width:760px){.space{transform:scale(.95)}}
</style>
</head>
<body>
<main class="stage">
  <section class="space">
    <div class="surface" id="surface">
      <div class="recorder">
        <button class="stop" id="stop" aria-label="Stop recording"></button>
        <div class="wavewrap"><canvas id="liveWave"></canvas></div>
        <span class="timer" id="timer">0:00</span>
      </div>

      <div class="editor">
        <section class="waveShell">
          <div class="fullWave" id="fullWave"></div>
          <div class="playhead" id="playhead"></div>
        </section>

        <div class="utilities">
          <button class="utility" id="reset" aria-label="New capture"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="utility" aria-label="Download"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg></button>
        </div>

        <footer class="controls">
          <div>
            <div class="status"><span class="statusDot"></span><span>SAMPLED</span></div>
            <div class="sampleTime" id="sampleTime">00:03:24</div>
          </div>
          <button class="control loop" id="loop" aria-label="Loop"><svg viewBox="0 0 24 24"><path d="M20 7h-3.5A7 7 0 1 0 19 16"/><path d="m17 4 3 3-3 3"/></svg></button>
          <button class="control play" id="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M9 7.5 17 12l-8 4.5Z"/></svg></button>
        </footer>
      </div>
    </div>
  </section>
</main>
<div class="hint">click stop · R reset · ?auto=1&clean=1 for capture</div>

<script>
const q=new URLSearchParams(location.search);if(q.get('clean')==='1')document.body.classList.add('clean');
const surface=document.getElementById('surface'),stop=document.getElementById('stop'),reset=document.getElementById('reset'),loop=document.getElementById('loop'),play=document.getElementById('play'),playIcon=document.getElementById('playIcon'),liveWave=document.getElementById('liveWave'),timer=document.getElementById('timer'),sampleTime=document.getElementById('sampleTime'),fullWave=document.getElementById('fullWave'),playhead=document.getElementById('playhead'),ctx=liveWave.getContext('2d');
const peaks=Array.from({length:30},()=>.045);let recording=true,startedAt=performance.now(),timerRaf=0,waveTimer=0,playing=false,looping=false,playRaf=0,progress=0,a=0,b=0;
const seeded=[.14,.20,.27,.46,.62,.38,.22,.31,.56,.74,.45,.28,.19,.34,.65,.82,.54,.33,.22,.42,.68,.49,.30,.18,.24,.53,.72,.40,.25,.17,.36,.58,.77,.52,.29,.20,.33,.61,.47,.26,.16,.28,.45,.66,.41,.23,.18,.32,.57,.73,.50,.31,.21,.39,.62,.46,.27,.18,.29,.55,.70,.44,.25,.17];
seeded.forEach(v=>{const s=document.createElement('span');s.style.height=Math.max(3,v*108)+'px';fullWave.appendChild(s)});
function resize(){const r=liveWave.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1)),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(liveWave.width!==w||liveWave.height!==h){liveWave.width=w;liveWave.height=h}return{w,h,d}}
function draw(){const{w,h,d}=resize();ctx.clearRect(0,0,w,h);const step=(w-2*d)/(peaks.length-1);ctx.lineWidth=Math.max(1.25*d,1);ctx.lineCap='round';ctx.strokeStyle='rgba(246,246,244,.9)';peaks.forEach((v,i)=>{const bh=Math.max(1.3*d,Math.pow(Math.max(.035,v),.58)*h*.78),x=d+i*step,y=(h-bh)/2,e=Math.min(i/7,(peaks.length-1-i)/5,1);ctx.globalAlpha=Math.max(.06,e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+bh);ctx.stroke()});ctx.globalAlpha=1}
function push(){const t=performance.now()/1000,base=.17+Math.abs(Math.sin(t*2.13))*.24+Math.abs(Math.sin(t*5.21+.7))*.16,hit=Math.random()>.72?Math.random()*.36:0;peaks.push(Math.min(1,base+hit));peaks.shift();draw()}
function renderTimer(){if(!recording)return;const ms=performance.now()-startedAt,s=Math.floor(ms/1000);timer.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');timerRaf=requestAnimationFrame(renderTimer)}
function format(ms){const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);return[String(m).padStart(2,'0'),String(s).padStart(2,'0'),String(cs).padStart(2,'0')].join(':')}
function stopRec(){if(!recording)return;recording=false;const ms=performance.now()-startedAt;cancelAnimationFrame(timerRaf);clearInterval(waveTimer);sampleTime.textContent=format(ms);requestAnimationFrame(()=>surface.classList.add('expanded'))}
function glyph(on){playIcon.innerHTML=on?'<path d="M9 7v10M15 7v10"/>':'<path d="M9 7.5 17 12l-8 4.5Z"/>'}
function animate(){if(!playing)return;progress+=.0028;if(progress>=1){if(looping)progress=0;else{progress=1;playing=false;glyph(false)}}playhead.style.transform='translateX('+(progress*304)+'px)';if(playing)playRaf=requestAnimationFrame(animate)}
function togglePlay(){if(recording)return;playing=!playing;glyph(playing);cancelAnimationFrame(playRaf);if(playing)playRaf=requestAnimationFrame(animate)}
function schedule(){a=setTimeout(stopRec,3200);b=setTimeout(resetDemo,7600)}
function resetDemo(){clearTimeout(a);clearTimeout(b);cancelAnimationFrame(playRaf);playing=false;looping=false;progress=0;loop.classList.remove('active');glyph(false);playhead.style.transform='translateX(0)';surface.classList.remove('expanded');setTimeout(()=>{recording=true;startedAt=performance.now();peaks.fill(.045);draw();clearInterval(waveTimer);waveTimer=setInterval(push,58);cancelAnimationFrame(timerRaf);renderTimer();if(q.get('auto')==='1')schedule()},430)}
stop.addEventListener('click',stopRec);surface.addEventListener('click',e=>{if(recording&&!e.target.closest('button'))stopRec()});reset.addEventListener('click',resetDemo);loop.addEventListener('click',()=>{looping=!looping;loop.classList.toggle('active',looping)});play.addEventListener('click',togglePlay);window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')resetDemo();if(e.key===' '&&!recording){e.preventDefault();togglePlay()}});window.addEventListener('resize',draw);
draw();waveTimer=setInterval(push,58);renderTimer();if(q.get('auto')==='1')schedule();
</script>
</body>
</html>
