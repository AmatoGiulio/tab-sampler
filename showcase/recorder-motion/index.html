<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Sampler — Recorder Motion</title>
  <style>
    :root {
      color-scheme: dark;
      background: #08090b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 46%,
          rgba(255,255,255,.035),
          transparent 34%
        ),
        #08090b;
    }

    #showcase-root {
      position: fixed;
      inset: 0;
      transform: scale(1.42);
      transform-origin: 50% 50%;
      pointer-events: none;
    }

    #showcase-root > div {
      pointer-events: auto;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.28);
      font:
        11px/1.2
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      white-space: nowrap;
      user-select: none;
    }

    body.clean .hint {
      display: none;
    }

    @media (max-width: 760px) {
      #showcase-root {
        transform: scale(.95);
      }
    }
  </style>
</head>
<body>
  <div id="showcase-root"></div>
  <div class="hint">click stop · R reset · ?clean=1</div>

  <script type="module">
    import { mountSamplerSurfaceDom } from '/src/ui/sampler-surface.ts';

    const params = new URLSearchParams(window.location.search);
    if (params.get('clean') === '1') {
      document.body.classList.add('clean');
    }

    // The standalone page intentionally mounts the exact same recorder surface
    // function used by the Chrome extension. Only the environment adapter differs.
    mountSamplerSurfaceDom(
      '/src/entrypoints/editor/index.html?demo=1',
      '__tab_sampler_showcase__',
      'recording',
      'showcase',
    );

    // Reposition the exact extension surface in the center of the capture canvas
    // without changing its internal geometry or motion.
    requestAnimationFrame(() => {
      const host = document.getElementById('__tab_sampler_showcase__');
      if (!host?.shadowRoot) return;

      const stage = host.shadowRoot.querySelector('.stage');
      const surface = host.shadowRoot.querySelector('.surface');
      if (!(stage instanceof HTMLElement) || !(surface instanceof HTMLElement)) return;

      stage.style.inset = '50% auto auto 50%';
      stage.style.width = '352px';
      stage.style.height = '284px';
      stage.style.transform = 'translate(-50%, -50%)';
      surface.style.top = '0';
      surface.style.right = '0';
    });
  </script>
</body>
</html>
